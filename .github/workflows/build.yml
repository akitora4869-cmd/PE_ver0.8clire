name: Build Client Mod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Client Mod
        run: gradle build

      - name: Show generated JARs
        run: |
          echo "=== Generated JARs ==="
          find build/libs -maxdepth 1 -type f -name "*.jar" -print

      - name: Upload Client Mod
        uses: actions/upload-artifact@v4
        with:
          name: Project-EVOLVE-Client
          path: build/libs/*.jar
          if-no-files-found: error
